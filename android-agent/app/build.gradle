plugins {
    id 'com.android.application'
}

def liveSmsEnabled = providers.gradleProperty('enableLiveSms')
        .map { it.equalsIgnoreCase('true') }
        .orElse(false)
        .get()

android {
    namespace 'com.nabda.agent'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nabda.agent'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'

        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        vectorDrawables.useSupportLibrary = false
    }

    flavorDimensions += 'transport'
    productFlavors {
        simulation {
            dimension 'transport'
            applicationIdSuffix '.simulation'
            versionNameSuffix '-simulation'
            buildConfigField 'boolean', 'SIMULATION_ONLY', 'true'
            buildConfigField 'boolean', 'LIVE_SMS_COMPILED_IN', 'false'
            resValue 'string', 'app_name', 'Nabda Agent (Simulation)'
            resValue 'string', 'mode_badge', 'SIMULATION · NO SMS'
            resValue 'string', 'flavor_subtitle', 'Add the server details from your Nabda dashboard. This build cannot send carrier SMS.'
        }
        live {
            dimension 'transport'
            buildConfigField 'boolean', 'SIMULATION_ONLY', 'false'
            buildConfigField 'boolean', 'LIVE_SMS_COMPILED_IN', liveSmsEnabled.toString()
            resValue 'string', 'app_name', 'Nabda Agent'
            resValue 'string', 'mode_badge', 'LIVE SMS · INTERNAL SIDELOAD'
            resValue 'string', 'flavor_subtitle', 'Connect this company-owned phone to its Nabda workspace.'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            manifestPlaceholders = [
                    usesCleartextTraffic : 'true',
                    networkSecurityConfig: '@xml/network_security_config_debug'
            ]
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [
                    // Local Desktop pairing uses cleartext HTTP on RFC 1918 addresses only.
                    // ServerUrlPolicy rejects public, hostname, and loopback targets before I/O.
                    usesCleartextTraffic : 'true',
                    networkSecurityConfig: '@xml/network_security_config'
            ]
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

androidComponents {
    beforeVariants(selector().all()) { variantBuilder ->
        def isLive = variantBuilder.productFlavors.any { flavor -> flavor.second == 'live' }
        if (isLive && (!liveSmsEnabled || variantBuilder.buildType != 'release')) {
            variantBuilder.enable = false
        }
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
}
