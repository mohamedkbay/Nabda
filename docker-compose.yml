name: nabda-api-saas

x-app-environment: &app-environment
  NODE_ENV: development
  HOST: 0.0.0.0
  PORT: 3000
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: "postgresql://${POSTGRES_USER:-nabda}:${POSTGRES_PASSWORD:?ضع POSTGRES_PASSWORD في ملف .env}@postgres:5432/${POSTGRES_DB:-nabda}"
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
  REDIS_URL: redis://redis:6379
  API_KEY_HASH_SECRET: "${API_KEY_HASH_SECRET:?ضع API_KEY_HASH_SECRET في ملف .env}"
  APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY:?ضع APP_ENCRYPTION_KEY في ملف .env}"
  # بيئة Compose هذه للتطوير فقط، ولذلك تمنع أي إرسال حقيقي قسرًا.
  PROVIDER_MODE: mock
  ENABLE_LIVE_SMS: "false"
  ENABLE_ANDROID_AGENT: "true"
  ENABLE_ANDROID_AGENT_LIVE_REPORTING: "false"
  HTTPSMS_API_BASE: https://api.httpsms.com/v1
  PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-15000}
  DISPATCH_MIN_INTERVAL_MS: ${DISPATCH_MIN_INTERVAL_MS:-3000}
  STATUS_POLL_INTERVAL_MS: ${STATUS_POLL_INTERVAL_MS:-10000}
  CLEANUP_INTERVAL_MS: ${CLEANUP_INTERVAL_MS:-3600000}
  CLEANUP_BATCH_SIZE: ${CLEANUP_BATCH_SIZE:-500}
  QUEUE_PREFIX: ${QUEUE_PREFIX:-nabda}
  RATE_LIMIT_FAIL_OPEN: "false"
  IP_REQUESTS_PER_MINUTE: ${IP_REQUESTS_PER_MINUTE:-1200}
  API_KEY_REQUESTS_PER_MINUTE: ${API_KEY_REQUESTS_PER_MINUTE:-600}
  DEVICE_REQUESTS_PER_MINUTE: ${DEVICE_REQUESTS_PER_MINUTE:-120}
  ORGANIZATION_WRITES_PER_MINUTE: ${ORGANIZATION_WRITES_PER_MINUTE:-60}
  WEBHOOK_TIMEOUT_MS: ${WEBHOOK_TIMEOUT_MS:-10000}
  SEED_ORG_NAME: ${SEED_ORG_NAME:-شركة تجريبية}
  SEED_ORG_SLUG: ${SEED_ORG_SLUG:-demo}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.invalid}
  FREE_ORG_NAME: ${FREE_ORG_NAME:-Local Free Organization}
  FREE_ORG_SLUG: ${FREE_ORG_SLUG:-local-free}
  FREE_ADMIN_EMAIL: ${FREE_ADMIN_EMAIL:-free@example.invalid}
  DEVICE_AGENT_ORG_SLUG: ${DEVICE_AGENT_ORG_SLUG:-local-free}
  DEVICE_AGENT_IDENTITY: ${DEVICE_AGENT_IDENTITY:-local-android-agent}
  DEVICE_AGENT_NAME: ${DEVICE_AGENT_NAME:-Nabda Android Device}

x-app-service: &app-service
  build:
    context: .
    target: development
  environment: *app-environment
  user: node
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m
  volumes:
    - .:/app:ro
    - node_modules:/app/node_modules:ro
  init: true

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nabda}
      POSTGRES_USER: ${POSTGRES_USER:-nabda}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?ضع POSTGRES_PASSWORD في ملف .env}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app-service
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app-service
    command: ["npm", "run", "dev"]
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 10
    restart: unless-stopped

  worker:
    <<: *app-service
    command: ["npm", "run", "worker:dev"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  node_modules:
