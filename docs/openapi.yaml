openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Nabda API
  version: 1.0.0
  summary: Transactional messaging API for expected customer communications.
  description: |
    Nabda queues and tracks transactional, authentication, and service messages for multi-tenant applications.

    Every request under `/v1` requires an API key with the operation's scope. New message requests also require an
    `Idempotency-Key` and an explicit `consent_confirmed: true` assertion. Recipients on the organization's opt-out
    list are blocked before dispatch.

    The permanent Free plan has no platform subscription fee. It provides 1,000 accepted message operations per
    calendar month, a limit of 10 operations per minute, one device, three API keys, two webhooks, 500 contacts, and
    30-day sensitive-content retention. Free platform access does not include SIM balance or carrier charges and is
    not an unlimited-message promise. This API contract does not create organizations or subscriptions.

    For local development, keep `PROVIDER_MODE=mock`. The examples below use dummy identifiers and a fictional phone
    number. Do not substitute a real recipient or enable a live provider while following the testing examples.

    The Android Phone Agent has a separate pull protocol under `/v1/device`. Those four operations authenticate with
    a device token—not an organization API key—and are documented for the simulation APK only. The simulation APK
    cannot send a carrier SMS. Live Android sending and live result reporting are unavailable and disabled in this MVP.
  contact:
    name: Nabda API Support
    url: http://localhost:3000/
  license:
    name: Proprietary
servers:
  - url: http://localhost:3000
    description: Local development server (Mock provider only)
tags:
  - name: Health
    description: Unauthenticated service and dependency checks.
  - name: Messages
    description: Queue a message and inspect its lifecycle.
  - name: Usage
    description: Read subscription credits and rate limits.
  - name: Queue
    description: Inspect the tenant's dispatch backlog.
  - name: Contacts
    description: Store tenant-scoped contacts and consent references.
  - name: Opt-outs
    description: Block a recipient and cancel their queued messages.
  - name: Phone agent
    description: Simulation-only Android pull protocol authenticated by a device-scoped token.
security:
  - ApiKeyAuth: []
  - BearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: getServiceHealth
      summary: Read service health and provider mode
      description: Use this before local message testing and confirm that `provider_mode` is `mock`.
      security: []
      responses:
        '200':
          description: The HTTP service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealth'
              examples:
                mock:
                  summary: Safe local development mode
                  value:
                    status: ok
                    provider_mode: mock
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Check process liveness
      description: Returns success when the API process can answer HTTP requests.
      security: []
      responses:
        '200':
          description: The process is live.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
              example:
                status: ok
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check PostgreSQL and Redis readiness
      security: []
      responses:
        '200':
          description: Required dependencies are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: ready
        '503':
          description: At least one required dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: not_ready
  /v1/device/heartbeat:
    post:
      tags: [Phone agent]
      operationId: heartbeatPhoneAgent
      summary: Report simulation-agent availability
      description: |
        Updates the authenticated device's last-seen time and lightweight telemetry. This operation uses a device
        token, not an organization API key. `simulated` must match the server-bound mode of that device credential;
        a request cannot switch a credential between simulation and live.
      security:
        - DeviceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceHeartbeatRequest'
            example:
              app_version: 0.1.0-simulation
              android_version: '15'
              battery_level: 82
              is_charging: true
              network_type: wifi
              simulated: true
      responses:
        '200':
          description: The device is active and may continue polling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceHeartbeatResponse'
              example:
                device_id: 31234567-89ab-4def-8123-456789abcdef
                server_time: '2026-08-30T12:00:00.000Z'
                live_reporting_enabled: false
                poll_after_ms: 10000
        '401':
          $ref: '#/components/responses/DeviceUnauthorized'
        '409':
          description: The organization or device is no longer available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: device_unavailable
                  message: The Android device is unavailable.
                  request_id: req-device-availability
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/DeviceAgentDisabled'
  /v1/device/messages/claim:
    post:
      tags: [Phone agent]
      operationId: claimPhoneAgentMessage
      summary: Reserve at most one queued message
      description: |
        Reserves one ready message for the authenticated device and returns a short-lived lease. Claiming does not
        authorize dispatch. The agent must persist the reservation and call the message-specific `begin` operation
        with one stable attempt ID. An empty queue returns `messages: []`.
      security:
        - DeviceTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceClaimRequest'
            example:
              limit: 1
              simulated: true
      responses:
        '200':
          description: Zero or one message was reserved for this device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceClaimResponse'
              examples:
                empty:
                  summary: Nothing ready
                  value:
                    messages: []
                    poll_after_ms: 10000
                reserved:
                  summary: Simulation work reserved
                  value:
                    messages:
                      - id: 01234567-89ab-4def-8123-456789abcdef
                        to: '+12025550123'
                        body: Your test order NB-1001 is ready.
                        lease_token: example_runtime_lease_token_not_a_secret_00000000
                        lease_expires_at: '2026-08-30T12:02:00.000Z'
                    poll_after_ms: 10000
        '401':
          $ref: '#/components/responses/DeviceUnauthorized'
        '403':
          description: A non-simulation claim was attempted while live reporting is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: android_agent_live_reporting_disabled
                  message: Live Android SMS reporting is disabled.
                  request_id: req-device-live-disabled
        '409':
          description: The organization or device is no longer available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/DeviceAgentDisabled'
  /v1/device/messages/{id}/begin:
    post:
      tags: [Phone agent]
      operationId: beginPhoneAgentMessage
      summary: Authorize one stable simulation attempt
      description: |
        Applies the final server-side safety fence before the simulation dispatcher runs. It validates the device,
        message, lease, stable attempt ID, expiry, opt-out state, and minimum device dispatch interval. Repeating the
        same successful lease and attempt is idempotent. An authorization in the simulation contract never authorizes
        a carrier SMS.
      security:
        - DeviceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceBeginRequest'
            example:
              lease_token: example_runtime_lease_token_not_a_secret_00000000
              attempt_id: 41234567-89ab-4def-8123-456789abcdef
              simulated: true
      responses:
        '200':
          description: The stable simulation attempt is authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceBeginResponse'
              example:
                authorized: true
                duplicate: false
                message_id: 01234567-89ab-4def-8123-456789abcdef
                lease_expires_at: '2026-08-30T12:15:00.000Z'
        '401':
          $ref: '#/components/responses/DeviceUnauthorized'
        '403':
          description: A non-simulation attempt was made while live reporting is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The message does not exist or is not owned by this device's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The lease, attempt, or current message state cannot be authorized safely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: The reservation lease expired before begin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: device_lease_expired
                  message: The device lease expired before the attempt began.
                  request_id: req-device-expired
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: The minimum device dispatch interval has not elapsed.
          headers:
            Retry-After:
              description: Seconds until this attempt may be retried.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/DeviceAgentDisabled'
  /v1/device/messages/{id}/events:
    post:
      tags: [Phone agent]
      operationId: recordPhoneAgentMessageEvent
      summary: Record an idempotent simulation result
      description: |
        Records a result for the exact begun lease and attempt. `event_id` is the idempotency identity: replaying the
        identical event is safe, while reusing it for a different attempt returns a conflict. For every documented
        simulation event, the public message becomes `cancelled` with `failure_code: simulation_only`; no carrier SMS
        is sent.
      security:
        - DeviceTokenAuth: []
      parameters:
        - $ref: '#/components/parameters/MessageId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEventRequest'
            example:
              lease_token: example_runtime_lease_token_not_a_secret_00000000
              attempt_id: 41234567-89ab-4def-8123-456789abcdef
              event_id: 51234567-89ab-4def-8123-456789abcdef
              status: sent
              occurred_at: '2026-08-30T12:00:01.000Z'
              provider_message_id: simulation-example-001
              simulated: true
      responses:
        '200':
          description: The simulation result was accepted or replayed idempotently.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEventResponse'
              example:
                accepted: true
                duplicate: false
                message_id: 01234567-89ab-4def-8123-456789abcdef
                status: cancelled
                failure_code: simulation_only
        '401':
          $ref: '#/components/responses/DeviceUnauthorized'
        '403':
          description: A non-simulation event was submitted while live reporting is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: The message does not exist or is not owned by this device's organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The event ID, lease, attempt, or requested status conflicts with the begun attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: The begun attempt lease expired before the result was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          $ref: '#/components/responses/DeviceAgentDisabled'
  /v1/messages:
    post:
      tags: [Messages]
      operationId: createMessage
      x-required-scope: messages:write
      summary: Queue a transactional message
      description: |
        Validates the request, opt-out state, current subscription, durable credit balance, and per-minute limit before
        creating a queued message. Dispatch is asynchronous. A new request returns `202`; replaying the same body with
        the same idempotency key returns `200` and `Idempotent-Replayed: true`.

        The `consent_confirmed` field is a required assertion from the caller. Use `consent_reference` to retain a link
        to the consent or customer-event record in your own system. Marketing is not an accepted purpose.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
            examples:
              transaction:
                summary: Expected order update using a dummy recipient
                value:
                  to: '+12025550123'
                  content: Your test order NB-1001 is ready.
                  purpose: transactional
                  consent_confirmed: true
                  consent_reference: checkout-NB-1001
                  client_reference: NB-1001
                  metadata:
                    environment: local
              authentication:
                summary: Authentication message
                value:
                  to: '+12025550123'
                  content: Your one-time test code is 482901.
                  purpose: authentication
                  consent_confirmed: true
                  consent_reference: login-session-demo
                  metadata:
                    environment: local
      responses:
        '202':
          description: A new message was accepted and queued.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
              example:
                data:
                  id: 01234567-89ab-4def-8123-456789abcdef
                  object: message
                  to: '+12025550123'
                  content: Your test order NB-1001 is ready.
                  purpose: transactional
                  status: queued
                  client_reference: NB-1001
                  failure: null
                  metadata:
                    environment: local
                  scheduled_at: '2026-08-30T12:00:00.000Z'
                  expires_at: '2026-08-31T12:00:00.000Z'
                  queued_at: '2026-08-30T12:00:00.000Z'
                  sent_at: null
                  delivered_at: null
                  failed_at: null
                  expired_at: null
                  cancelled_at: null
                  created_at: '2026-08-30T12:00:00.000Z'
                  updated_at: '2026-08-30T12:00:00.000Z'
        '200':
          description: The identical idempotent request was replayed.
          headers:
            Idempotent-Replayed:
              description: Present with the string value `true` for a replay.
              schema:
                type: string
                const: 'true'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The idempotency key was already used with a different request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: idempotency_conflict
                  message: The Idempotency-Key was already used with a different request.
                  request_id: req-demo-001
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: Validation, phone, scheduling, opt-out, or device selection failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalid_phone:
                  value:
                    error:
                      code: invalid_phone
                      message: to must be a valid E.164 phone number.
                      request_id: req-demo-002
                opted_out:
                  value:
                    error:
                      code: recipient_opted_out
                      message: The recipient is on this organization's blocklist.
                      request_id: req-demo-003
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/messages/{id}:
    get:
      tags: [Messages]
      operationId: getMessage
      x-required-scope: messages:read
      summary: Retrieve a message
      description: Returns a message only when it belongs to the authenticated organization.
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: The message lifecycle record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
              example:
                data:
                  id: 01234567-89ab-4def-8123-456789abcdef
                  object: message
                  to: '+12025550123'
                  content: Your test order NB-1001 is ready.
                  purpose: transactional
                  status: delivered
                  client_reference: NB-1001
                  failure: null
                  metadata:
                    environment: local
                  scheduled_at: '2026-08-30T12:00:00.000Z'
                  expires_at: '2026-08-31T12:00:00.000Z'
                  queued_at: '2026-08-30T12:00:00.000Z'
                  sent_at: '2026-08-30T12:00:01.000Z'
                  delivered_at: '2026-08-30T12:00:02.000Z'
                  failed_at: null
                  expired_at: null
                  cancelled_at: null
                  created_at: '2026-08-30T12:00:00.000Z'
                  updated_at: '2026-08-30T12:00:02.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The ID is malformed, missing, or belongs to another organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: message_not_found
                  message: The message was not found.
                  request_id: req-demo-004
  /v1/usage:
    get:
      tags: [Usage]
      operationId: getUsage
      x-required-scope: usage:read
      summary: Read current subscription usage
      description: Use `messages_remaining` for credits, `per_minute_rate_limit` for pacing, and `max_contacts` for recipient storage capacity.
      responses:
        '200':
          description: Current subscription usage.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageEnvelope'
              example:
                data:
                  plan: free
                  subscription_status: active
                  period_start: '2026-08-01T00:00:00.000Z'
                  period_end: '2026-09-01T00:00:00.000Z'
                  messages_used: 1
                  message_limit: 1000
                  messages_remaining: 999
                  per_minute_rate_limit: 10
                  max_contacts: 500
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No current subscription exists for this organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: subscription_not_found
                  message: No current subscription was found.
                  request_id: req-demo-005
  /v1/queue:
    get:
      tags: [Queue]
      operationId: getQueueSummary
      x-required-scope: messages:read
      summary: Read the dispatch queue summary
      description: Counts only queued messages owned by the authenticated organization.
      responses:
        '200':
          description: Current tenant-scoped queue counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueEnvelope'
              example:
                data:
                  object: queue_summary
                  queued_total: 2
                  ready: 1
                  scheduled: 1
                  processing: 0
                  oldest_queued_at: '2026-08-30T12:00:00.000Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      x-required-scope: contacts:read
      summary: List active contacts
      description: |
        Returns contacts in descending `(created_at, id)` order. Pass `meta.next_cursor` unchanged to retrieve the
        next page. The cursor is opaque and scoped to this endpoint.
      parameters:
        - $ref: '#/components/parameters/ContactLimit'
        - $ref: '#/components/parameters/ContactCursor'
      responses:
        '200':
          description: A page of active contacts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactListEnvelope'
              example:
                data:
                  - id: 11234567-89ab-4def-8123-456789abcdef
                    object: contact
                    name: Demo Customer
                    phone: '+12025550123'
                    consent_reference: checkout-NB-1001
                    tags: [customer, test]
                    metadata:
                      environment: local
                    created_at: '2026-08-30T12:00:00.000Z'
                    updated_at: '2026-08-30T12:00:00.000Z'
                meta:
                  limit: 20
                  next_cursor: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Contacts]
      operationId: upsertContact
      x-required-scope: contacts:write
      summary: Create or update a contact by phone
      description: |
        Phone numbers are normalized to E.164. Posting the same active phone within an organization atomically updates
        that contact and returns `200`; a new active contact returns `201`. Creation requires an active subscription
        and cannot exceed the plan's `max_contacts`. This operation does not send a message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertContactRequest'
            example:
              name: Demo Customer
              phone: '+12025550123'
              consent_reference: checkout-NB-1001
              tags: [customer, test]
              metadata:
                environment: local
      responses:
        '201':
          description: A contact was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactEnvelope'
        '200':
          description: The existing active contact was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: The plan's active contact capacity was reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: contact_limit_exceeded
                  message: The plan's active contact limit was reached.
                  details:
                    limit: 100
                  request_id: req-demo-contact-limit
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /v1/contacts/{id}:
    delete:
      tags: [Contacts]
      operationId: deleteContact
      x-required-scope: contacts:write
      summary: Delete a contact and its stored personal data
      description: Removes the active contact from listing while preserving its audit history.
      parameters:
        - $ref: '#/components/parameters/ContactId'
      responses:
        '204':
          description: The contact row was deleted while the deletion fact remains in the audit log. The response has no body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The contact is missing, already deleted, or belongs to another organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  code: contact_not_found
                  message: The contact was not found.
                  request_id: req-demo-006
  /v1/opt-outs:
    post:
      tags: [Opt-outs]
      operationId: createOptOut
      x-required-scope: opt_outs:write
      summary: Add a recipient to the blocklist
      description: |
        Creates an organization-scoped opt-out and cancels queued messages for the normalized recipient. Repeating an
        active opt-out is safe and returns `200`; a new opt-out returns `201`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOptOutRequest'
            example:
              phone: '+12025550123'
              reason: Demo recipient request
      responses:
        '201':
          description: A new opt-out was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptOutEnvelope'
              example:
                data:
                  id: 21234567-89ab-4def-8123-456789abcdef
                  object: opt_out
                  phone: '+12025550123'
                  active: true
                  cancelled_message_ids:
                    - 01234567-89ab-4def-8123-456789abcdef
        '200':
          description: The recipient was already opted out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptOutEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Raw Nabda API key. It is hashed server-side and must never be committed to source control.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Nabda API key
      description: Alternative to `x-api-key`. Do not send conflicting values through both methods.
    DeviceTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: Nabda device token
      description: |
        Device-scoped token used only by the Android Phone Agent under `/v1/device`. It is separate from the
        organization API key, is shown once during local provisioning, and must not be placed in source control,
        screenshots, support messages, URLs, or logs.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique retry key. Reuse it only for an identical request body.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]{16,128}$'
      example: msg-demo-20260830-0001
    MessageId:
      name: id
      in: path
      required: true
      description: Tenant-owned message UUID.
      schema:
        type: string
        format: uuid
      example: 01234567-89ab-4def-8123-456789abcdef
    ContactId:
      name: id
      in: path
      required: true
      description: Tenant-owned contact UUID.
      schema:
        type: string
        format: uuid
      example: 11234567-89ab-4def-8123-456789abcdef
    ContactLimit:
      name: limit
      in: query
      required: false
      description: Maximum contacts returned in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ContactCursor:
      name: cursor
      in: query
      required: false
      description: Opaque `next_cursor` value returned by the previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
  headers:
    RateLimitLimit:
      description: Per-minute message limit for the current subscription.
      schema:
        type: integer
        minimum: 1
    RateLimitRemaining:
      description: Requests remaining in the active rate-limit window.
      schema:
        type: integer
        minimum: 0
    RateLimitReset:
      description: ISO 8601 timestamp when the current rate-limit window resets.
      schema:
        type: string
        format: date-time
  responses:
    Unauthorized:
      description: The API key is missing, invalid, expired, or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: invalid_api_key
              message: A valid API key is required.
              request_id: req-demo-auth
    Forbidden:
      description: The API key lacks the required scope or the subscription is inactive.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            scope:
              value:
                error:
                  code: insufficient_scope
                  message: The API key requires the messages:write scope.
                  request_id: req-demo-scope
            subscription:
              value:
                error:
                  code: subscription_inactive
                  message: An active subscription is required.
                  request_id: req-demo-subscription
    PayloadTooLarge:
      description: The HTTP body exceeded 32 KiB.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: payload_too_large
              message: The request body is too large.
              request_id: req-demo-size
    ValidationFailed:
      description: A request field or query parameter failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: validation_error
              message: The request body is invalid.
              details: {}
              request_id: req-demo-validation
    RateLimited:
      description: The per-minute limit or subscription credit limit was reached.
      headers:
        Retry-After:
          description: Seconds for a rate limit, or an HTTP date for a subscription quota reset.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            per_minute:
              value:
                error:
                  code: rate_limited
                  message: The per-minute message limit was exceeded.
                  details:
                    limit: 2
                    remaining: 0
                    resetAt: '2026-08-30T12:01:00.000Z'
                  request_id: req-demo-rate
            credits:
              value:
                error:
                  code: subscription_quota_exceeded
                  message: The subscription message quota was reached.
                  details:
                    limit: 5
                    used: 5
                    resetsAt: '2026-09-13T00:00:00.000Z'
                  request_id: req-demo-quota
    ServiceUnavailable:
      description: A required abuse-prevention dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: rate_limit_unavailable
              message: The abuse-prevention service is temporarily unavailable.
              request_id: req-demo-unavailable
    DeviceUnauthorized:
      description: The device token is missing, invalid, revoked, rotated, or belongs to an unavailable device.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: invalid_device_token
              message: A valid Android device token is required.
              request_id: req-device-auth
    DeviceAgentDisabled:
      description: The Android Phone Agent protocol is disabled on this server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: device_agent_disabled
              message: The Android device agent is disabled on this server.
              request_id: req-device-disabled
  schemas:
    ServiceHealth:
      type: object
      additionalProperties: false
      required: [status, provider_mode]
      properties:
        status:
          type: string
          const: ok
        provider_mode:
          type: string
          enum: [mock, httpsms]
    Liveness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Readiness:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
    DeviceHeartbeatRequest:
      type: object
      additionalProperties: false
      required: [app_version, android_version]
      properties:
        app_version:
          type: string
          minLength: 1
          maxLength: 64
        android_version:
          type: string
          minLength: 1
          maxLength: 64
        battery_level:
          type: number
          minimum: 0
          maximum: 100
        is_charging:
          type: boolean
        network_type:
          type: string
          minLength: 1
          maxLength: 32
        simulated:
          type: boolean
          default: true
          description: Must match the authenticated credential (`true` for simulation, `false` for live).
    DeviceHeartbeatResponse:
      type: object
      additionalProperties: false
      required: [device_id, server_time, execution_mode, live_reporting_enabled, poll_after_ms]
      properties:
        device_id:
          type: string
          format: uuid
        server_time:
          type: string
          format: date-time
        execution_mode:
          type: string
          enum: [simulation, live]
          description: Server-authoritative mode bound to the authenticated device credential.
        live_reporting_enabled:
          type: boolean
          description: True only for a live credential on an explicitly live-enabled production server.
        poll_after_ms:
          type: integer
          minimum: 1000
    DeviceClaimRequest:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          const: 1
          default: 1
        simulated:
          type: boolean
          default: true
          description: Must match the server-bound credential mode.
    DeviceClaimedMessage:
      type: object
      additionalProperties: false
      required: [id, to, body, execution_mode, lease_token, lease_expires_at]
      properties:
        id:
          type: string
          format: uuid
        to:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{7,14}$'
          description: Recipient E.164 until terminal-message retention cleanup replaces it with null.
        body:
          type: string
          minLength: 1
          maxLength: 1000
        execution_mode:
          type: string
          enum: [simulation, live]
          description: Immutable mode selected when the API accepted this message.
        lease_token:
          type: string
          minLength: 32
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
          description: Short-lived reservation secret. Persist it securely and never log it.
        lease_expires_at:
          type: string
          format: date-time
    DeviceClaimResponse:
      type: object
      additionalProperties: false
      required: [messages, poll_after_ms]
      properties:
        messages:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/DeviceClaimedMessage'
        poll_after_ms:
          type: integer
          minimum: 1000
    DeviceBeginRequest:
      type: object
      additionalProperties: false
      required: [lease_token, attempt_id, simulated]
      properties:
        lease_token:
          type: string
          minLength: 32
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
        attempt_id:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Stable identity generated once for this reservation and reused for retries.
        simulated:
          type: boolean
          description: Must match the server-bound credential mode.
    DeviceBeginResponse:
      type: object
      additionalProperties: false
      required: [authorized, duplicate, message_id, lease_expires_at]
      properties:
        authorized:
          type: boolean
          const: true
        duplicate:
          type: boolean
          description: True when the exact lease and attempt were already authorized.
        message_id:
          type: string
          format: uuid
        lease_expires_at:
          type: string
          format: date-time
    DeviceEventRequest:
      type: object
      additionalProperties: false
      required: [lease_token, attempt_id, event_id, status, simulated]
      properties:
        lease_token:
          type: string
          minLength: 32
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
        attempt_id:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
        event_id:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Stable idempotency identity for this result event.
        status:
          type: string
          enum: [sent, delivered, failed, cancelled]
          description: Simulation reports are normalized server-side to `cancelled` with `simulation_only`.
        occurred_at:
          type: string
          format: date-time
          description: Optional device time, no more than 24 hours old or five minutes in the future.
        provider_message_id:
          type: string
          minLength: 1
          maxLength: 255
        error_code:
          type: string
          minLength: 1
          maxLength: 100
        error_message:
          type: string
          minLength: 1
          maxLength: 500
        simulated:
          type: boolean
          description: Must match the server-bound credential mode.
    DeviceEventResponse:
      type: object
      additionalProperties: false
      required: [accepted, duplicate, message_id, status, failure_code]
      properties:
        accepted:
          type: boolean
          const: true
        duplicate:
          type: boolean
          description: True when this exact event was already accepted.
        message_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/MessageStatus'
        failure_code:
          type: [string, 'null']
          description: "`simulation_only` for the documented simulation flow."
    CreateMessageRequest:
      type: object
      additionalProperties: false
      required: [to, content, purpose, consent_confirmed, consent_reference]
      properties:
        device_id:
          type: string
          format: uuid
          description: Optional active tenant device. The service selects one when omitted.
        to:
          type: string
          minLength: 1
          maxLength: 32
          description: Recipient number normalized by the server to E.164.
          examples: ['+12025550123']
        content:
          type: string
          minLength: 1
          maxLength: 1000
          description: Message text. It must fit one SMS segment (up to 160 GSM-7 septets or 70 UTF-16 units) and may later be returned as `[redacted]` under the retention policy.
        purpose:
          type: string
          enum: [transactional, authentication, service]
        consent_confirmed:
          type: boolean
          const: true
          description: Caller assertion that this expected communication may be sent to the recipient.
        consent_reference:
          type: string
          minLength: 1
          maxLength: 255
          description: Required reference to the caller's auditable consent evidence.
        client_reference:
          type: string
          minLength: 1
          maxLength: 100
        scheduled_at:
          type: string
          format: date-time
          description: Optional offset timestamp, no more than seven days ahead.
        expires_at:
          type: string
          format: date-time
          description: Must follow `scheduled_at` and be within 30 days of request time.
        metadata:
          type: object
          additionalProperties: true
          default: {}
          description: Arbitrary JSON object whose serialized form must not exceed 4096 bytes.
    MessageStatus:
      type: string
      enum: [queued, sent, delivered, failed, expired, cancelled]
    MessageFailure:
      type: [object, 'null']
      additionalProperties: false
      required: [code, reason]
      properties:
        code:
          type: string
        reason:
          type: [string, 'null']
    Message:
      type: object
      additionalProperties: false
      required:
        - id
        - object
        - to
        - content
        - purpose
        - status
        - execution_mode
        - client_reference
        - failure
        - metadata
        - scheduled_at
        - expires_at
        - queued_at
        - sent_at
        - delivered_at
        - failed_at
        - expired_at
        - cancelled_at
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: message
        to:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        content:
          type: string
          description: Original message text until retention cleanup replaces it with `[redacted]`.
        purpose:
          type: string
          enum: [transactional, authentication, service]
        status:
          $ref: '#/components/schemas/MessageStatus'
        execution_mode:
          type: string
          enum: [simulation, live]
          description: Immutable dispatch boundary. Simulation messages can never be claimed by a live worker or phone credential.
        client_reference:
          type: [string, 'null']
        failure:
          $ref: '#/components/schemas/MessageFailure'
        metadata:
          type: object
          additionalProperties: true
        scheduled_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        queued_at:
          type: string
          format: date-time
        sent_at:
          $ref: '#/components/schemas/NullableDateTime'
        delivered_at:
          $ref: '#/components/schemas/NullableDateTime'
        failed_at:
          $ref: '#/components/schemas/NullableDateTime'
        expired_at:
          $ref: '#/components/schemas/NullableDateTime'
        cancelled_at:
          $ref: '#/components/schemas/NullableDateTime'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MessageEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Message'
    Usage:
      type: object
      additionalProperties: false
      required:
        - plan
        - subscription_status
        - period_start
        - period_end
        - messages_used
        - message_limit
        - messages_remaining
        - per_minute_rate_limit
        - max_contacts
      properties:
        plan:
          type: string
        subscription_status:
          type: string
          enum: [trialing, active, past_due, paused, cancelled, expired]
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        messages_used:
          type: integer
          format: int64
          minimum: 0
        message_limit:
          type: integer
          format: int64
          minimum: 1
        messages_remaining:
          type: integer
          format: int64
          minimum: 0
        per_minute_rate_limit:
          type: integer
          minimum: 1
        max_contacts:
          type: integer
          minimum: 1
    UsageEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Usage'
    QueueSummary:
      type: object
      additionalProperties: false
      required: [object, queued_total, ready, scheduled, processing, oldest_queued_at]
      properties:
        object:
          type: string
          const: queue_summary
        queued_total:
          type: integer
          minimum: 0
        ready:
          type: integer
          minimum: 0
        scheduled:
          type: integer
          minimum: 0
        processing:
          type: integer
          minimum: 0
        oldest_queued_at:
          $ref: '#/components/schemas/NullableDateTime'
    QueueEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/QueueSummary'
    UpsertContactRequest:
      type: object
      additionalProperties: false
      required: [name, phone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 1
          maxLength: 32
          description: Phone number normalized by the server to E.164.
        consent_reference:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
        tags:
          type: array
          maxItems: 50
          uniqueItems: true
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 64
        metadata:
          type: object
          additionalProperties: true
          default: {}
          description: Arbitrary JSON object whose serialized form must not exceed 4096 bytes.
    Contact:
      type: object
      additionalProperties: false
      required: [id, object, name, phone, consent_reference, tags, metadata, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: contact
        name:
          type: string
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        consent_reference:
          type: [string, 'null']
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ContactEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Contact'
    ContactListEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        meta:
          type: object
          additionalProperties: false
          required: [limit, next_cursor]
          properties:
            limit:
              type: integer
              minimum: 1
              maximum: 100
            next_cursor:
              type: [string, 'null']
    CreateOptOutRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string
          minLength: 1
          maxLength: 32
        reason:
          type: string
          minLength: 1
          maxLength: 500
    OptOut:
      type: object
      additionalProperties: false
      required: [id, object, phone, active, cancelled_message_ids]
      properties:
        id:
          type: string
          format: uuid
        object:
          type: string
          const: opt_out
        phone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        active:
          type: boolean
          const: true
        cancelled_message_ids:
          type: array
          items:
            type: string
            format: uuid
    OptOutEnvelope:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/OptOut'
    NullableDateTime:
      type: [string, 'null']
      format: date-time
    ErrorDetail:
      description: Operation-specific structured error context.
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
