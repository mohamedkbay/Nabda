name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Lint source
        run: npm run lint
      - name: Test API, authentication, deployment settings and starter clients
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build both independent outputs for localhost
        run: npm run build
      - name: Check the Worker bundle without deploying
        run: node node_modules/wrangler/bin/wrangler.js deploy --config wrangler.nabda.json --dry-run --outdir deploy-build/cloudflare-worker
